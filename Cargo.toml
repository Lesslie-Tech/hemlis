[package]
name = "hemlis"
version = "0.1.0"
edition = "2024"

[dependencies]
logos = { version = "0.14.2", features = [] }
rayon = "1.10.0"
dashmap = "6.1.0"
hemlis_macros = { path = "hemlis_macros/" }
serde = { version = "1.0.215", features = [ "derive" ] }
tracing = "0.1.41"
glob = "0.3.1"
serde_json = { version = "1.0.78", features = [] }
sungod = { version = "0.3.1", features = ["default_is_random"] }
tokio = { version = "1.17.0", features = ["full"] }
tower-lsp-server = { version = "0.23.0", features = ["proposed"]}
futures = "0.3.31"
json-subscriber = "0.2.4"
tracing-subscriber = "0.3.19"
chrono = "0.4.39"
notify = "8"

[dev-dependencies]
insta = "1.40.0"
goldentests = "1.1"
indoc = "2.0.7"
tower-service = "0.3"

[[bin]]
name = "hemlis-language-server"
path = "src/main.rs"

[[bin]]
name = "hemlis"
path = "src/lib/main.rs"
test = false

[lib]
name = "hemlis_lib"
path = "src/lib/lib.rs"
